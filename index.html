<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Q4 Lift</title>
<style>
:root{
  --bg:#0e1116; --card:#171b22; --card2:#1f242d; --line:#2a303b; --text:#eef1f5; --mut:#9aa3b2;
  --acc:#ff8a3d; --acc2:#ffb27a; --ok:#3ecf8e; --warn:#f5c451; --bad:#ff6b6b; --blue:#6aa8ff;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom)) 0;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;box-shadow:0 8px 12px -10px rgba(0,0,0,.8)}
.datebar{display:flex;align-items:center;gap:8px}
.navbtn{width:52px;height:52px;border-radius:14px;background:var(--card);font-size:26px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.datecenter{flex:1;text-align:center;min-width:0}
.dow{font-size:26px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:15px}
.todaybtn{display:inline-block;margin-top:4px;padding:4px 12px;border-radius:999px;background:var(--acc);color:#111;font-weight:700;font-size:14px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700;background:var(--card2);color:var(--mut)}
.pill.acc{background:rgba(255,138,61,.16);color:var(--acc2)}
.pill.deload{background:rgba(106,168,255,.16);color:var(--blue)}
.pill.test{background:rgba(62,207,142,.16);color:var(--ok)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;border:1px solid var(--line)}
.hero h1{margin:0 0 4px;font-size:30px;line-height:1.1;letter-spacing:-.4px}
.hero .phase{color:var(--mut);font-size:16px;margin-top:6px}
.banner{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.banner.shoulder{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35)}
.banner.deload{background:rgba(106,168,255,.1);border:1px solid rgba(106,168,255,.35)}
.banner.info{background:var(--card2)}
.sec{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:800;margin:22px 4px 6px}
.ex{background:var(--card);border-radius:var(--r);margin:10px 0;border:1px solid var(--line);overflow:hidden}
.ex.main{border-color:rgba(255,138,61,.55)}
.ex.done{opacity:.62}
.exhead{display:flex;align-items:center;gap:12px;padding:14px;min-height:72px;width:100%;text-align:left}
.tag{flex:0 0 auto;min-width:40px;height:40px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:var(--mut)}
.ex.main .tag{background:var(--acc);color:#111}
.exname{flex:1;min-width:0}
.exname b{display:block;font-size:20px;line-height:1.2}
.exname span{display:block;color:var(--acc2);font-weight:700;font-size:17px;margin-top:2px}
.exname small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.chk{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#0b1a12}
.exbody{padding:0 14px 14px}
.hint{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--mut);margin-bottom:10px}
.hint b{color:var(--text)}
.hint .sug{color:var(--ok);font-weight:700}
.hint .rep{color:var(--warn);font-weight:700}
.setrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.setno{width:26px;color:var(--mut);font-weight:800;text-align:center;flex:0 0 auto}
.fld{flex:1;min-width:0;position:relative}
.fld input{width:100%;height:56px;border-radius:12px;border:1px solid var(--line);background:#0b0e13;font-size:24px;font-weight:700;text-align:center;padding:14px 4px 0}
.fld input:focus{outline:2px solid var(--acc);border-color:transparent}
.fld label{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.5px;text-transform:uppercase;pointer-events:none}
.del{width:40px;height:56px;color:var(--mut);font-size:22px;flex:0 0 auto}
.btnrow{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;height:56px;border-radius:14px;background:var(--card2);font-weight:800;font-size:18px}
.btn.pri{background:var(--acc);color:#111}
.btn.ok{background:var(--ok);color:#0b1a12}
.btn.small{height:44px;font-size:16px;flex:0 0 auto;padding:0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:999px;background:var(--card2);font-weight:700;font-size:16px;border:1px solid var(--line)}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc)}
.rest{text-align:center;padding:26px 16px}
.rest .big{font-size:56px}
.rest h2{margin:6px 0;font-size:26px}
.rest p{color:var(--mut);margin:6px 0}
/* checklist */
.ck{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}
.ck:last-child{border-bottom:0}
.ck .lbl{flex:1}
.ck .lbl b{display:block;font-size:20px}
.ck .lbl small{color:var(--mut);font-size:14px}
.ckrow{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 4px;border-bottom:1px solid var(--line)}
.ckrow .lbl{flex:1}
.ckrow .lbl b{display:block;font-size:20px}
.ckrow .lbl small{color:var(--mut);font-size:14px}
.prot{display:flex;gap:8px;margin:2px 0 10px 62px}
.prot .btn{height:52px}
.protval{font-size:22px;font-weight:800}
.bw{width:120px;height:56px;border-radius:12px;border:1px solid var(--line);background:#0b0e13;font-size:24px;font-weight:700;text-align:center}
.bwnote{font-size:14px;color:var(--mut);margin:6px 4px 0 62px}
.bwnote b.over{color:var(--warn)}
/* week grid */
.wk{display:grid;grid-template-columns:96px repeat(7,1fr);gap:6px 4px;align-items:center;font-size:14px}
.wk .h{color:var(--mut);text-align:center;font-weight:800}
.wk .h.cur{color:var(--acc)}
.wk .rl{color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:22px;height:22px;border-radius:50%;margin:0 auto;background:var(--card2);border:1px solid var(--line)}
.dot.on{background:var(--ok);border-color:var(--ok)}
.dot.na{background:transparent;border:1px dashed #333a46;opacity:.5}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px}
.stat small{color:var(--mut);font-size:13px}
textarea.notes{width:100%;min-height:150px;border-radius:12px;border:1px solid var(--line);background:#0b0e13;padding:12px;font-size:18px;resize:vertical}
.saved{color:var(--mut);font-size:13px;text-align:right;margin-top:4px;min-height:18px}
/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(14,17,22,.96);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav.tabs button{flex:1;height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--mut)}
nav.tabs button .i{font-size:24px;line-height:1}
nav.tabs button.on{color:var(--acc)}
/* history */
.hist{border-bottom:1px solid var(--line);padding:12px 2px}
.hist:last-child{border-bottom:0}
.hist .d{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.hist .s{font-size:18px;font-weight:700;margin-top:4px}
.hist .e{color:var(--acc2);font-size:15px}
svg.spark{width:100%;height:120px;display:block}
/* settings */
table.tg{width:100%;border-collapse:collapse;font-size:15px}
table.tg th{color:var(--mut);text-align:left;font-size:13px;padding:6px 4px}
table.tg td{padding:4px}
table.tg input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:#0b0e13;text-align:center;font-size:17px}
.wkhd{font-weight:800;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--mut);font-size:15px}
.hidden{display:none!important}
.csec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
.cshead{display:flex;align-items:center;gap:10px;width:100%;min-height:64px;padding:8px 16px;text-align:left}
.cshead .ct{flex:1;font-size:21px;font-weight:800}
.cnt{padding:4px 12px;border-radius:999px;background:var(--card2);color:var(--mut);font-weight:800;font-size:16px}
.cnt.full{background:rgba(62,207,142,.18);color:var(--ok)}
.car{color:var(--mut);font-size:20px;width:20px;text-align:center}
.cbody{padding:0 14px 8px;border-top:1px solid var(--line)}
.dot.half{background:linear-gradient(90deg,var(--ok) 50%,var(--card2) 50%);border-color:var(--ok)}
.feelrow{padding:12px 4px 4px}
.feelhd small{color:var(--mut);font-size:14px}
.fbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fbtn{width:calc((100% - 30px)/6);min-width:44px;height:54px;border-radius:12px;background:var(--card2);border:2px solid var(--line);font-size:22px;font-weight:800}
.fbtn.on.fg{background:var(--ok);color:#0b1a12;border-color:var(--ok)} .fbtn.on.fy{background:var(--warn);color:#201800;border-color:var(--warn)} .fbtn.on.fr{background:var(--bad);color:#200505;border-color:var(--bad)}
.routinebtn{width:100%;margin-top:12px;background:var(--card2)}
.routine{background:var(--card2);border-radius:14px;padding:14px 16px;margin:10px 0 6px}
.routine h3{margin:14px 0 6px;font-size:22px;color:var(--acc2)} .routine h3:first-child{margin-top:0}
.routine h3 small{font-size:15px;color:var(--mut);font-weight:600}
.routine ol,.routine ul{margin:0;padding-left:26px} .routine li{margin:10px 0;font-size:19px;line-height:1.3}
.routine li b{display:block;font-size:21px} .routine li span{display:block;color:var(--mut);font-size:17px}
.routine ul li{font-size:17px} .routine em{color:var(--warn);font-style:normal;font-weight:700}
.moodrow{display:flex;gap:8px}
.mbtn{flex:1;height:76px;border-radius:14px;background:var(--card2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mbtn span{font-size:32px;line-height:1} .mbtn small{color:var(--mut);font-size:13px;font-weight:700}
.mbtn.on{border-color:var(--acc);background:rgba(255,138,61,.16)}
svg.trend{width:100%;height:auto;display:block}
.habrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.habrow .chip{min-width:62px;text-align:center;padding:10px 8px}
.habname{flex:1;min-width:0;height:48px;border-radius:10px;border:1px solid var(--line);background:#0b0e13;padding:0 10px;font-size:16px}
.habnum{width:74px;height:48px;border-radius:10px;border:1px solid var(--line);background:#0b0e13;text-align:center;font-size:16px}
span.habnum{border:0;background:none} .habrow small{width:34px;color:var(--mut);font-size:12px}
.movesheet{border-color:var(--acc)}
.moveopt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:64px;padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
.moveopt b{font-size:19px} .moveopt small{color:var(--mut);font-size:14px}
.lastline{color:var(--mut);font-size:15px;margin:0 2px 6px;line-height:1.35}
.lastline.sug{color:var(--ok);font-weight:700} .lastline.rep{color:var(--warn);font-weight:700}
.fld input::placeholder{color:#59616e;font-weight:600}
.ex.custom{border-style:dashed}
.btn.addex{height:60px;border:2px dashed var(--line);background:transparent;color:var(--acc2)}
.histpick{width:100%;height:52px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:17px;padding:0 12px}
.syncline{color:var(--mut);font-size:14px;text-align:center;margin:-2px 0 12px}
.syncbox{background:var(--card2);border-radius:12px;padding:12px;font-size:16px;font-weight:700}
.syncbox.ok,.syncline.ok{color:var(--ok)} .syncbox.err,.syncline.err{color:var(--warn)}
.syncinput{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:#0b0e13;padding:0 12px;font-size:16px}
.topbanner{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:50;background:var(--card2);border:1px solid var(--acc);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.topbanner span{flex:1}
.topbanner .btn{flex:0 0 auto;height:44px;padding:0 14px;font-size:16px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs">
  <button data-tab="today" class="on"><span class="i">🏋️</span>Today</button>
  <button data-tab="history"><span class="i">📈</span>History</button>
  <button data-tab="plan"><span class="i">⚙️</span>Plan &amp; Backup</button>
</nav>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<script>
'use strict';
/* ================= PROGRAM ================= */
const START = [2026, 9, 12];           // Mon Oct 12 2026 (month 0-based)
const NWEEKS = 12;
const KEY = 'q4lift.v1';
const APP_VERSION = '2026.10.18-habits';

const PHASES = w => w===1?{name:'Re-entry',cls:'acc',desc:'Ease back in after vacation and find working weights. Accessories: 2 sets.'}
  : w<=6?{name:'Build',cls:'acc',desc:'RPE 7 rising to 8 by week 6.'+(w>=5?' Flat bench and overhead press are in (if shoulders feel good).':'')}
  : w===7?{name:'Deload · Thanksgiving',cls:'deload',desc:'Same lifts, about half the sets, RPE 6. Recover before the heavier phase.'}
  : w<=10?{name:'Strength',cls:'acc',desc:'RPE 8. Accessories keep the same rep ranges.'}
  : w===11?{name:'Deload · Christmas',cls:'deload',desc:'About half the sets, RPE 6. Skipping a session is fine.'}
  : {name:'Test week',cls:'test',desc:'Work up to a heavy bench triple @ RPE 9. Rescan DEXA in early January.'};

const MAIN_SLOTS = {A1:'Floor press (Tue)', B1:'Belt squat (Mon)', C1:'Board press / Flat bench (Thu)', D1:'Trap bar deadlift (Sat)'};
// Defaults from the plan's 12-week phase chart. All editable in Plan tab.
function defaultTarget(w, slot){
  const t=(sets,reps,rpe,note='')=>({sets:String(sets),reps:String(reps),rpe:String(rpe),note});
  if(w===1) return t(3,5,6);
  if(w<=6){ const rpe={2:7,3:7,4:7.5,5:7.5,6:8}[w]; return t(4, slot==='D1'?5:6, rpe); }
  if(w===7) return t(2, slot==='D1'?5:6, 6, 'Deload: about half the sets');
  if(w<=10) return (slot==='A1'||slot==='C1')? t(5,'3–4',8) : t(4,4,8);
  if(w===11) return (slot==='A1'||slot==='C1')? t(3,3,6,'Deload: about half the sets') : t(2,4,6,'Deload: about half the sets');
  // week 12
  if(slot==='C1') return t(1,3,9,'Work up to a heavy triple');
  return t(3,3,7,'Plan only specifies the bench test — keep these crisp');
}

// weekday: 0=Sun..6=Sat
const SCHEDULE = {1:'B',2:'A',3:null,4:'C',5:null,6:'D',0:null};
const BJJ_DAYS = new Set([2,3,4,5]);
const DAY_TITLE = {A:'Day A — Upper (floor press)',B:'Day B — Lower (squat)',C:'Day C — Upper (bench)',D:'Day D — Lower (hinge)'};

function workout(day, w, variant){
  const early = w<5;
  if(day==='A') return [
    {id:'A1',tag:'1',name:'Floor press',main:true,slot:'A1',inc:5},
    {id:'A2a',tag:'2a',name:'Chest-supported row',sx:'4 × 8'},
    {id:'A2b',tag:'2b',name:'Band external rotation',sx:'3 × 15',note:'or your PT drill'},
    early?{id:'A3a-lm',tag:'3a',name:'Half-kneeling landmine press',sx:'3 × 8 / arm',note:'Weeks 1–4'}
         :{id:'A3a-ohp',tag:'3a',name:'Standing overhead press',sx:'3 × 8',note:'Start light; landmine if shoulders object'},
    {id:'A3b',tag:'3b',name:'Pull-up or lat pulldown',sx:'3 × 8–10'},
    {id:'A4',tag:'4',name:'Face pull',sx:'3 × 15'},
    {id:'A5',tag:'5',name:'Rolling DB triceps extension',sx:'3 × 10–12'}];
  if(day==='B') return [
    {id:'B1',tag:'1',name:'Belt squat',main:true,slot:'B1',inc:10},
    {id:'B2',tag:'2',name:'Romanian deadlift',sx:'3 × 8'},
    {id:'B3',tag:'3',name:'Bulgarian split squat',sx:'3 × 8 / leg'},
    {id:'B4a',tag:'4a',name:'Hamstring curl',sx:'3 × 10–12',note:'lying or seated'},
    {id:'B4b',tag:'4b',name:'Adductor machine',sx:'3 × 12–15',note:'or cable adduction'},
    {id:'B5a',tag:'5a',name:'Pallof press',sx:'3 × 10 / side'},
    {id:'B5b',tag:'5b',name:'Dead bug',sx:'3 × 8 / side',noW:true}];
  if(day==='C'){
    const board = early || variant==='board';
    return [
    board?{id:'C1-board',tag:'1',name:'Board press',main:true,slot:'C1',inc:5,note:early?'Weeks 1–4':'Shoulder-flare day swap'}
         :{id:'C1-bench',tag:'1',name:'Flat bench',main:true,slot:'C1',inc:5,note:'Board press on shoulder-flare days'},
    {id:'C2',tag:'2',name:'Barbell or seal row',sx:'4 × 6–8'},
    {id:'C3a',tag:'3a',name:'Incline DB press, neutral grip',sx:'3 × 10'},
    {id:'C3b',tag:'3b',name:'Single-arm DB row',sx:'3 × 10 / arm'},
    {id:'C4a',tag:'4a',name:'Rear delt fly or band pull-apart',sx:'3 × 15–20'},
    {id:'C4b',tag:'4b',name:'Prone Y-T-W raise',sx:'2 × 8 each'},
    {id:'C5',tag:'5',name:'Curl (any variation)',sx:'3 × 10–12'}];
  }
  if(day==='D') return [
    {id:'D1',tag:'1',name:'Trap bar deadlift',main:true,slot:'D1',inc:10},
    {id:'D2',tag:'2',name:'Hip thrust',sx:'3 × 8'},
    {id:'D3',tag:'3',name:'Zercher squat, wide stance',sx:'3 × 6–8 @ RPE 7',note:'bar pad or towel on elbows'},
    {id:'D4',tag:'4',name:'Copenhagen plank',sx:'3 × 20–30 sec / side',note:'start with knee on bench',repLbl:'sec',noW:true},
    {id:'D5a',tag:'5a',name:'Farmer carry',sx:'4 × 40 yd',repLbl:'yd'},
    {id:'D5b',tag:'5b',name:'Neck isometrics',sx:'2 × 20 sec each, light',note:'front, back, sides',repLbl:'sec',noW:true}];
  return [];
}
const HIST_LIFTS = [['A1','Floor press'],['B1','Belt squat'],['C1-board','Board press'],['C1-bench','Flat bench'],['D1','Trap bar'],['A3a-ohp','Overhead press'],['BW','Bodyweight']];

/* ================= DATE UTILS (UTC-day math avoids DST bugs) ================= */
const dayNum = (y,m,d)=>Math.round(Date.UTC(y,m,d)/864e5);
const START_N = dayNum(...START);
const keyOf = n=>{const d=new Date(n*864e5);return d.toISOString().slice(0,10);};
const fromKey = k=>{const [y,m,d]=k.split('-').map(Number);return dayNum(y,m-1,d);};
const todayN = ()=>{const d=new Date();return dayNum(d.getFullYear(),d.getMonth(),d.getDate());};
const wdOf = n=>new Date(n*864e5).getUTCDay();
const weekOf = n=>Math.floor((n-START_N)/7)+1;          // 1..12 in program
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = n=>{const d=new Date(n*864e5);return MON[d.getUTCMonth()]+' '+d.getUTCDate();};

/* ================= STATE ================= */
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ S = {}; }

normalize();  // sched: {date:{lift,from?,to?}} overrides; skip: {date:true}  // custom: {A:[{id,name,added}],...}

function D(k){ return S.days[k] || (S.days[k] = {checks:{},protein:0,bw:'',notes:'',ex:{}}); }
function peek(k){ return S.days[k]; }
function target(w, slot){ const o=(S.targets[w]||{})[slot]; return Object.assign(defaultTarget(w,slot), o||{}); }

let view = {tab:'today', n: todayN(), open:{}, histLift:'A1'};

const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= HELPERS ================= */
function lastSession(exId, beforeN){
  const keys = Object.keys(S.days).filter(k=>fromKey(k)<beforeN).sort().reverse();
  for(const k of keys){ const e=S.days[k].ex&&S.days[k].ex[exId]; if(e && e.sets && e.sets.some(s=>s.w!==''||s.r!=='')) return {k, e}; }
  return null;
}
const setStr = (s,withRpe)=>`${s.w||'BW'}×${s.r||'?'}${withRpe&&s.rpe?' @'+s.rpe:''}`;
function suggestion(ex, sess){
  const w = weekOf(fromKey(sess.k)); if(w<1||w>NWEEKS) return null;
  const t = target(w, ex.slot);
  const tr = parseFloat(t.reps), trpe = parseFloat(t.rpe);
  const sets = sess.e.sets.filter(s=>s.w!==''&&s.r!=='');
  if(!sets.length||isNaN(tr)||isNaN(trpe)) return null;
  const last = sets[sets.length-1], lw = parseFloat(last.w);
  const lastHigh = last.rpe!=='' && parseFloat(last.rpe) >= trpe+1;
  const allHit = sets.every(s=>parseFloat(s.r)>=tr && (s.rpe===''||parseFloat(s.rpe)<=trpe));
  if(lastHigh) return {cls:'rep',txt:`Last set ran high → repeat ${lw} lb`};
  if(allHit) return {cls:'sug',txt:`All sets on target → try ${lw+ex.inc} lb (+${ex.inc})`};
  const repsHit = sets.every(s=>parseFloat(s.r)>=tr);
  if(repsHit) return {cls:'rep',txt:`Reps hit, RPE a bit over ${trpe} → repeat ${lw} lb`};
  return {cls:'rep',txt:`Missed target reps → repeat ${lw} lb`};
}
function e1rm(s){ const w=parseFloat(s.w), r=parseFloat(s.r); if(!w||!r) return 0; const rir = s.rpe!==''&&!isNaN(parseFloat(s.rpe)) ? 10-parseFloat(s.rpe) : 0; return w*(1+(r+rir)/30); }

/* ---- schedule overrides (move / swap / skip) ---- */
function liftFor(n){ const k=keyOf(n), o=S.sched[k]; return (o && 'lift' in o) ? (o.lift||null) : (SCHEDULE[wdOf(n)]||null); }
const isSkipped = n=>!!S.skip[keyOf(n)];
const weekMon = n=>n-((wdOf(n)+6)%7);
const shortDay = k=>{ const n=fromKey(k); return DOW[wdOf(n)].slice(0,3)+' '+fmt(n); };
function hasLogs(k, lift){ const d=peek(k); if(!d||!d.ex) return false; const w=weekOf(fromKey(k));
  const ids=new Set([...workout(lift,w,d.variant||'').map(e=>e.id), ...(S.custom[lift]||[]).map(c=>c.id)]);
  return Object.entries(d.ex).some(([id,e])=>ids.has(id)&&(e.done||(e.sets||[]).some(s=>s.w!==''||s.r!==''))); }
function moveWorkout(k1, k2){
  const n1=fromKey(k1), n2=fromKey(k2), L1=liftFor(n1), L2=liftFor(n2);
  if(!L1 || k1===k2) return;
  S.sched[k2]={lift:L1, from:k1};
  S.sched[k1]= L2 ? {lift:L2, from:k2, swap:true} : {lift:null, to:k2};
  if(L2) S.sched[k2].swap=true;
  delete S.skip[k1]; delete S.skip[k2];
}
function resetWeek(n){ const mon=weekMon(n); for(let i=0;i<7;i++){ const k=keyOf(mon+i); delete S.sched[k]; delete S.skip[k]; } }
function weekHasOverrides(n){ const mon=weekMon(n); for(let i=0;i<7;i++){ const k=keyOf(mon+i); if(S.sched[k]||S.skip[k]) return true; } return false; }
function moveSheet(n){
  const k=keyOf(n), L=liftFor(n), mon=weekMon(n);
  let h=`<div class="card movesheet"><b>Move Day ${L} (${shortDay(k)}) to…</b><p class="muted" style="margin:6px 0 8px">Same week only. Picking a lifting day swaps the two workouts.</p>`;
  for(let i=0;i<7;i++){ const n2=mon+i; if(n2===n) continue; const k2=keyOf(n2), L2=liftFor(n2);
    const past=n2<todayN();
    h+=`<button class="moveopt" data-act="moveTo" data-k="${k2}"><span><b>${DOW[wdOf(n2)]}</b> <small>${fmt(n2)}${past?' · past':''}</small><br><small>${L2?DAY_TITLE[L2]:(wdOf(n2)===0?'Rest day':'No lifting')}${BJJ_DAYS.has(wdOf(n2))?' · BJJ':''}</small></span><span class="pill ${L2?'':'acc'}">${L2?'Swap':'Move here'}</span></button>`; }
  h+=`<div class="btnrow"><button class="btn" data-act="moveCancel">Cancel</button><button class="btn" data-act="skipDay">Skip this workout</button></div></div>`;
  return h;
}

const CHECKS = n=>{
  const wd=wdOf(n), skipped=isSkipped(n), lift=skipped?null:liftFor(n), sk=liftFor(n);
  const arr=[];
  arr.push(lift?{id:'trained',b:'Lifted',s:DAY_TITLE[lift]}:skipped&&sk?{id:'trained',b:'Rest from lifting',s:`Day ${sk} skipped`}:{id:'trained',b:'Rest from lifting',s:wd===0?'Sunday: fully off':(S.sched[keyOf(n)]&&S.sched[keyOf(n)].to)?'Workout moved to '+shortDay(S.sched[keyOf(n)].to):'No lifting scheduled'});
  if(BJJ_DAYS.has(wd)) arr.push({id:'bjj',b:'BJJ',s:lift?'Roll tonight, 6+ hrs after lifting':'Mat day'});
  return arr;
};
const num0 = v=>{ const x=parseFloat(v); return isNaN(x)?0:x; };

/* ================= HABITS (config is editable in Plan & Backup > Habits) ================= */

const HABITS=[
 {id:'trained',sec:'train',fixed:true,short:'Lift/rest',name:'Lifted'},
 {id:'bjj',sec:'train',kind:'check',name:'BJJ',short:'BJJ'},
 {id:'steps',sec:'train',kind:'steps',name:'Steps',short:'Steps',goal:11000,unit:'steps'},
 {id:'pt',sec:'rec',kind:'pt',name:'Shoulder PT',short:'Shoulder PT'},
 {id:'bw',sec:'rec',kind:'bw',name:'Bodyweight',short:'Weigh-in'},
 {id:'cold',sec:'rec',kind:'weekly',name:'Cold plunge / sauna',short:'Cold/sauna',target:3,off:true},
 {id:'creatine',sec:'nut',kind:'check',name:'Creatine + morning supps',short:'Creatine',sub:'3–5 g creatine + your morning stack'},
 {id:'protein',sec:'nut',kind:'protein',name:'Protein',short:'Protein',goal:200,unit:'g'},
 {id:'water',sec:'nut',kind:'water',name:'Water',short:'Water',goal:80,unit:'oz'},
 {id:'food',sec:'nut',kind:'check',name:'Track food',short:'Food'},
 {id:'prayer',sec:'mind',kind:'check',name:'Prayer & quiet time',short:'Prayer'},
 {id:'read',sec:'mind',kind:'check',name:'Read 5 pages',short:'Read'},
 {id:'journal',sec:'mind',kind:'weekly',name:'Journal',short:'Journal',target:3,off:true},
 {id:'spanish',sec:'mind',kind:'weekly',name:'Spanish',short:'Spanish',target:3,off:true},
 {id:'visual',sec:'mind',kind:'weekly',name:'Visualization',short:'Visualize',target:3,off:true},
 {id:'mood',sec:'bottom',kind:'mood',name:'Mood',short:'Mood'}
];
const HB=Object.fromEntries(HABITS.map(x=>[x.id,x]));
const hcfg = id=>S.habits[id]||{};
const hon = id=>{ const x=HB[id], c=hcfg(id); return x.fixed ? true : (c.on!==undefined ? !!c.on : !x.off); };
const hname = id=>(hcfg(id).name||'').trim()||HB[id].name;
const hshort = id=>(hcfg(id).name||'').trim()||HB[id].short;
const hg = id=>{ const g=parseFloat(hcfg(id).goal); return g>0?g:HB[id].goal; };
const ht = id=>{ const g=parseFloat(hcfg(id).target); return g>0?g:HB[id].target; };
const proteinDone = d=>(d.protein||0)>=hg('protein');
const ptMob = d=>{ const c=d.checks||{}; return c.pt_mob!==undefined||c.pt_str!==undefined ? !!c.pt_mob : !!c.pt; };   // old "Home PT" ticks count as both
const ptStr = d=>{ const c=d.checks||{}; return c.pt_mob!==undefined||c.pt_str!==undefined ? !!c.pt_str : !!c.pt; };
function doneOn(id, dd){
  if(!dd) return false; const c=dd.checks||{};
  switch(HB[id].kind){
    case 'protein': return proteinDone(dd);
    case 'water': return num0(dd.water)>=hg('water');
    case 'steps': return num0(dd.steps)>=hg('steps');
    case 'bw': return dd.bw!==''&&dd.bw!=null;
    case 'mood': return num0(dd.mood)>0;
    case 'pt': return ptMob(dd)&&ptStr(dd);
    default: return !!c[id];
  }
}
const applicable=(id,n)=> id==='bjj' ? BJJ_DAYS.has(wdOf(n)) : true;
function weekCount(id,n){ const mon=weekMon(n); let c=0; for(let i=0;i<7;i++){ const x=peek(keyOf(mon+i)); if(x&&x.checks&&x.checks[id]) c++; } return c; }
function itemCount(x,d,n){
  if(x.kind==='weekly'||x.kind==='mood') return [0,0];
  if(x.kind==='pt') return [(ptMob(d)?1:0)+(ptStr(d)?1:0),2];
  return [doneOn(x.id,d)?1:0,1];
}
function ckBtn(id,label,sub,on){ return `<button class="ck" data-act="check" data-id="${id}"><span class="chk ${on?'on':''}">✓</span><span class="lbl"><b>${esc(label)}</b><small>${sub}</small></span></button>`; }

function ptBlock(n,d){
  const f=d.feel; let feel='';
  for(let v=0;v<=10;v++) feel+=`<button class="fbtn f${v<=2?'g':v<=5?'y':'r'} ${f!==undefined&&f!==''&&+f===v?'on':''}" data-act="feel" data-v="${v}">${v}</button>`;
  return ckBtn('pt_mob','Mobility','~1–2 min each move',ptMob(d))+ckBtn('pt_str','Strength','light, controlled',ptStr(d))+
   `<div class="feelrow"><div class="feelhd"><b>Shoulder feel</b> <small>after your session · 0 = no pain</small></div><div class="fbtns">${feel}</div></div>

function habitItem(x,n,d){
  const c=d.checks||{};
  switch(x.kind){
    case 'pt': return ptBlock(n,d);
    case 'weekly': return ckBtn(x.id,hname(x.id),`${weekCount(x.id,n)} / ${ht(x.id)} this week`,!!c[x.id]);
    case 'steps': return `<div class="ckrow"><span class="chk ${doneOn('steps',d)?'on':''}">✓</span><span class="lbl"><b>${esc(hname('steps'))}</b><small>Goal ${hg('steps').toLocaleString('en-US')}</small></span><input class="bw" id="steps" type="number" inputmode="numeric" placeholder="steps" value="${esc(d.steps??'')}"></div>`;
    case 'protein': return `<div class="ckrow" style="border-bottom:0"><span class="chk ${proteinDone(d)?'on':''}">✓</span><span class="lbl"><b>${esc(hname('protein'))} <span class="protval">${d.protein||0}</span> / ${hg('protein')} g</b><small>~1 g per lb bodyweight</small></span></div>
      <div class="prot"><button class="btn" data-act="prot" data-v="-25">−25</button><button class="btn" data-act="prot" data-v="25">+25</button><button class="btn pri" data-act="prot" data-v="50">+50</button></div>`;
    case 'water': return `<div class="ckrow" style="border-bottom:0"><span class="chk ${doneOn('water',d)?'on':''}">✓</span><span class="lbl"><b>${esc(hname('water'))} <span class="protval">${num0(d.water)}</span> / ${hg('water')} oz</b><small>tap as you drink</small></span></div>
      <div class="prot"><button class="btn" data-act="water" data-v="-8">−8</button><button class="btn" data-act="water" data-v="8">+8</button><button class="btn pri" data-act="water" data-v="16">+16</button></div>`;
    case 'bw': return `<div class="ckrow"><span class="chk ${d.bw!==''&&d.bw!=null?'on':''}">✓</span><span class="lbl"><b>${esc(hname('bw'))}</b><small>Morning, after bathroom</small></span>
      <input class="bw" id="bw" type="number" inputmode="decimal" step="0.1" placeholder="lb" value="${esc(d.bw)}"></div>
      <div class="bwnote" id="bwnote">${bwNote(n, parseFloat(d.bw))}</div>`;
    default: {
      const ck=CHECKS(n).find(z=>z.id===x.id);
      if(x.id==='trained'||x.id==='bjj') return ck?ckBtn(x.id,ck.b,ck.s,!!c[x.id]):'';
      return ckBtn(x.id,hname(x.id),x.sub||'',!!c[x.id]);
    }
  }
}
function secBlock(sec,n,d){
  const [sid,title]=sec;
  const hs=HABITS.filter(x=>x.sec===sid&&hon(x.id)&&applicable(x.id,n));
  if(!hs.length) return '';
  let done=0,tot=0; hs.forEach(x=>{ const c=itemCount(x,d,n); done+=c[0]; tot+=c[1]; });
  const open=S.ui.sec[sid]!==false;
  return `<div class="csec"><button class="cshead" data-act="sec" data-id="${sid}"><span class="ct">${title}</span><span class="cnt ${tot&&done===tot?'full':''}">${done}/${tot}</span><span class="car">${open?'▾':'▸'}</span></button>${open?`<div class="cbody">${hs.map(x=>habitItem(x,n,d)).join('')}</div>`:''}</div>`;
}
function moodBlock(d){
  if(!hon('mood')) return '';
  const E=['😞','😕','😐','🙂','😄'];
  return `<div class="sec">${esc(hname('mood'))}</div><div class="card"><div class="moodrow">${E.map((e,i)=>`<button class="mbtn ${num0(d.mood)===i+1?'on':''}" data-act="mood" data-v="${i+1}" aria-label="Mood ${i+1} of 5"><span>${e}</span><small>${i+1}</small></button>`).join('')}</div></div>`;
}

/* ================= RENDER ================= */
const app = document.getElementById('app');
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===view.tab));
  if(view.tab==='today') renderToday(); else if(view.tab==='history') renderHistory(); else renderPlan();
}

function renderToday(){
  const n=view.n, k=keyOf(n), wd=wdOf(n), w=weekOf(n), d=peek(k)||{checks:{},protein:0,bw:'',notes:'',ex:{}};
  const inProg = w>=1 && w<=NWEEKS;
  const sched = S.sched[k]||{}, skipped = inProg && isSkipped(n), schedLift = inProg ? liftFor(n) : null;
  const lift = skipped ? null : schedLift;
  const ph = inProg ? PHASES(w) : null;
  let h = `<header class="top"><div class="datebar">
    <button class="navbtn" data-act="prev" aria-label="Previous day">‹</button>
    <div class="datecenter"><div class="dow">${n===todayN()?'Today':DOW[wd]}</div>
      <div class="sub">${DOW[wd].slice(0,3)}, ${fmt(n)}${inProg?` · Week ${w} of ${NWEEKS}`:''}</div>
      ${n!==todayN()?'<button class="todaybtn" data-act="today">Jump to today</button>':''}</div>
    <button class="navbtn" data-act="next" aria-label="Next day">›</button></div></header>`;

  // hero
  if(!inProg){
    h += `<div class="card rest">${w<1?`<div class="big">🗓️</div><h2>Program starts Mon, Oct 12</h2><p>12 weeks · Oct 12 – Jan 3</p>
      <div class="btnrow"><button class="btn pri" data-act="goto" data-n="${START_N}">Preview Week 1, Day B</button></div>`
      :`<div class="big">🏁</div><h2>Q4 block complete</h2><p>Rescan DEXA early January — morning, fasted.</p>`}</div>`;
  } else {
    h += `<div class="card hero"><span class="pill ${ph.cls}">Week ${w} · ${ph.name}</span>
      <h1 style="margin-top:10px">${lift?DAY_TITLE[lift]:skipped&&schedLift?DAY_TITLE[schedLift]+' — skipped':(wd===0?'Rest day':BJJ_DAYS.has(wd)?'BJJ only':'No lifting')}</h1>
      ${lift&&sched.from?`<div class="banner info">🔁 ${sched.swap?'Swapped with':'Moved from'} ${shortDay(sched.from)}.</div>`:''}
      <div class="phase">${ph.desc}</div>
      ${lift==='A'||lift==='C'?`<div class="banner shoulder">⚠️ <b>Shoulder rule:</b> pain (not effort) ends the set. Switch to floor or board press for the rest of the day.</div>`:''}
      ${lift?`<div class="btnrow"><button class="btn small" data-act="moveOpen">📅 Move workout</button><button class="btn small" data-act="skipDay">Skip</button>${weekHasOverrides(n)?'<button class="btn small" data-act="resetWeek">Reset week</button>':''}</div>`:''}
      ${lift&&BJJ_DAYS.has(wd)?`<div class="banner info">🥋 Lift this morning, roll tonight (6+ hrs apart). Brutal roll or tweak last time? Do the main lift + 2 accessories.</div>`:''}
    </div>`;
  }

  if(view.moveOpen && lift) h += moveSheet(n);
  if(skipped){
    h += `<div class="card rest"><div class="big">⏭️</div><h2>Day ${schedLift} skipped</h2><p>No lifting logged for this one.</p><div class="btnrow"><button class="btn pri" data-act="unskip">Undo skip</button></div></div>`;
  } else if(inProg && !lift && sched.to){
    h += `<div class="card rest"><div class="big">📅</div><h2>Moved to ${shortDay(sched.to)}</h2><p>Day ${S.sched[sched.to]&&S.sched[sched.to].lift||''} is on ${DOW[wdOf(fromKey(sched.to))]} this week.</p>
      <div class="btnrow"><button class="btn" data-act="goto" data-n="${fromKey(sched.to)}">Go to ${DOW[wdOf(fromKey(sched.to))].slice(0,3)}</button><button class="btn pri" data-act="resetWeek">Undo</button></div></div>`;
  } else if(lift){
    const variant = (d.variant||'');
    const exs = workout(lift, w, variant);
    const doneCount = exs.filter(e=>(d.ex[e.id]||{}).done).length;
    h += `<div class="sec">Workout · ${doneCount}/${exs.length} done</div>`;
    if(lift==='C' && w>=5){
      h += `<div class="chips" style="margin:4px 2px 6px"><button class="chip ${variant!=='board'?'on':''}" data-act="variant" data-v="">Flat bench</button><button class="chip ${variant==='board'?'on':''}" data-act="variant" data-v="board">Board press (shoulder flare)</button></div>`;
    }
    exs.forEach(ex=>{ h += exCard(ex, d, n, w); });
    customFor(lift, k, d).forEach(ex=>{ h += exCard(ex, d, n, w); });
    h += addExForm(lift);
  } else if(inProg){
    h += `<div class="card rest">${weekHasOverrides(n)?'':''}${wd===0?`<div class="big">😴</div><h2>Sunday: fully off</h2><p>No lifting, no BJJ. Recover.</p>`
      :`<div class="big">🥋</div><h2>BJJ tonight</h2><p>No lifting today. Good day for home PT and tissue work.</p>`}</div>`;
  }

  // checklist
  h += `<div class="sec">Daily checklist</div>` + SECS.map(s=>secBlock(s,n,d)).join('');

  // notes, mood, then weekly summary
  h += `<div class="sec">Notes · ${fmt(n)}</div><div class="card"><textarea class="notes" id="notes" placeholder="How did it feel? Shoulders, neck, knees, sleep, rolls…">${esc(d.notes)}</textarea><div class="saved" id="saved"></div></div>`;
  h += moodBlock(d);
  h += `<div id="wkbox">${weekSummary(n)}</div>`;
  h += `<div class="syncline" data-sync-status></div>`;
  app.innerHTML = h;
}

function bwNote(n, bw){
  const vals=[]; for(let i=0;i<7;i++){ const x=peek(keyOf(n-i)); if(x&&x.bw!==''&&x.bw!=null&&!isNaN(parseFloat(x.bw))) vals.push(parseFloat(x.bw)); }
  const avg = vals.length? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : null;
  let s = `Goal: stay under <b>216 lb</b>.`;
  if(avg) s += ` 7-day avg: <b class="${avg>=216?'over':''}">${avg}</b> (${vals.length} entr${vals.length===1?'y':'ies'}).`;
  if(!isNaN(bw)&&bw>=216) s += ` <b class="over">Over 216 — remember creatine adds 2–4 lb of water early. Judge by the January DEXA.</b>`;
  else s += ` Creatine adds 2–4 lb water early; judge by the January DEXA, not the scale.`;
  return s;
}

function setCount(ex, w){
  if(ex.main) return Math.max(1, parseInt(target(w, ex.slot).sets)||3);
  if(ex.custom) return 3;
  const m=parseInt(ex.sx)||3;
  if(w===1) return 2;
  if(w===7||w===11) return Math.ceil(m/2);
  return m;
}
function lastLine(ex, last, n){
  const sets=last.e.sets.filter(s=>s.w!==''||s.r!=='');
  const ago=n-fromKey(last.k);
  const lbl = ago===7 ? 'Last week' : `Last time (${fmt(fromKey(last.k))})`;
  const unit=ex.repLbl?' '+ex.repLbl:'';
  const parts=sets.map((s,i)=>{
    const w = (s.w===''||ex.noW) ? '' : (i===0? `${s.w} lb × ` : `${s.w} × `);
    return `${w}${s.r||'?'}${unit}${ex.main&&s.rpe?' @'+s.rpe:''}`;
  });
  return `${lbl}: ${parts.join(', ')}`;
}
function exCard(ex, d, n, w){
  const e = d.ex[ex.id] || {sets:[],done:false};
  const t = ex.main ? target(w, ex.slot) : null;
  const cnt = setCount(ex, w);
  const tgtTxt = ex.main ? `${t.sets} × ${t.reps} @ RPE ${t.rpe}`
    : ex.custom ? 'Your exercise'
    : (w===1? ex.sx.replace(/^\d/, '2')+' (wk 1: 2 sets)' : (w===7||w===11)? ex.sx.replace(/^\d/, String(cnt))+' (deload)' : ex.sx);
  const open = view.open[ex.id] ?? !e.done;
  const last = lastSession(ex.id, n);
  const lastSets = last ? last.e.sets.filter(s=>s.w!==''||s.r!=='') : [];
  let h = `<div class="ex ${ex.main?'main':''} ${ex.custom?'custom':''} ${e.done?'done':''}">
    <div class="exhead"><span class="tag">${ex.tag}</span>
      <button class="exname" style="text-align:left" data-act="toggle" data-id="${ex.id}"><b>${esc(ex.name)}</b><span>${tgtTxt}${ex.main?' · editable':''}</span>${(t&&t.note)||ex.note?`<small>${esc([ex.note,t&&t.note].filter(Boolean).join(' · '))}</small>`:''}
      ${!open&&e.sets.some(s=>s.w!==''||s.r!=='')?`<small>Today: ${e.sets.filter(s=>s.w!==''||s.r!=='').map(s=>setStr(s,ex.main)).join(', ')}</small>`:''}</button>
      <button class="chk ${e.done?'on':''}" data-act="done" data-id="${ex.id}" aria-label="Mark done">✓</button></div>`;
  if(open){
    h += `<div class="exbody">`;
    if(last){
      h += `<div class="lastline">${esc(lastLine(ex, last, n))}</div>`;
      if(ex.main){ const sg=suggestion(ex,last); if(sg) h += `<div class="lastline ${sg.cls}">${sg.txt}</div>`; }
    } else {
      h += `<div class="lastline">${ex.main ? (ex.id==='A1'&&w<=2?'No log yet. Plan: floor press around 195–205 for 4×6 in week 2 (RPE 7).':ex.id==='C1-bench'?'No log yet. Start at a weight that feels like RPE 7.':'No log yet. Find a working weight at the target RPE.') : 'No log yet. Enter what you lift; next time it shows here.'}</div>`;
    }
    const rows = Math.max(cnt, e.sets.length);
    for(let i=0;i<rows;i++){
      const s = e.sets[i] || {w:'',r:'',rpe:''};
      const ph = lastSets[i] || lastSets[lastSets.length-1] || {};
      const nm = ex.custom ? ` data-name="${esc(ex.name)}"` : '';
      h += `<div class="setrow"><span class="setno">${i+1}</span>
        ${ex.noW?'':`<div class="fld"><label>lb</label><input type="number" inputmode="decimal" step="2.5" data-f="w" data-id="${ex.id}" data-i="${i}"${nm} value="${esc(s.w)}" placeholder="${esc(ph.w||'')}"></div>`}
        <div class="fld"><label>${ex.repLbl||'reps'}</label><input type="number" inputmode="numeric" data-f="r" data-id="${ex.id}" data-i="${i}"${nm} value="${esc(s.r)}" placeholder="${esc(ph.r||'')}"></div>
        ${ex.main?`<div class="fld"><label>RPE</label><input type="number" inputmode="decimal" step="0.5" min="5" max="10" data-f="rpe" data-id="${ex.id}" data-i="${i}" value="${esc(s.rpe)}" placeholder="${esc(ph.rpe||'')}"></div>`:''}
        ${i<e.sets.length?`<button class="del" data-act="delset" data-id="${ex.id}" data-i="${i}" aria-label="Clear set">✕</button>`:'<span class="del"></span>'}</div>`;
    }
    if(ex.main) h += `<div class="lastline" style="font-size:13px">Rule: every set hits target reps at/below target RPE → +${ex.inc} lb next week. Last set 1+ RPE high → repeat weight.</div>`;
    else if(!ex.custom) h += `<div class="lastline" style="font-size:13px">Gray numbers = last time. Hit the top of the rep range on all sets → add a little weight.</div>`;
    else h += `<div class="lastline" style="font-size:13px">Gray numbers = last time.</div>`;
    h += `<div class="btnrow"><button class="btn" data-act="addset" data-id="${ex.id}"${ex.custom?` data-name="${esc(ex.name)}"`:''}>+ Add set</button>
      <button class="btn ${e.done?'':'ok'}" data-act="done" data-id="${ex.id}">${e.done?'Undo done':'Done ✓'}</button></div>
      ${ex.custom?`<div class="btnrow"><button class="btn small" data-act="rmEx" data-id="${ex.id}" data-name="${esc(ex.name)}">Remove from Day ${ex.day}</button></div>`:''}</div>`;
  }
  return h+`</div>`;
}

const slug = s=>'x-'+String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function customFor(lift, k, d){
  const list=(S.custom[lift]||[]).filter(c=>!c.added||c.added<=k);
  const ids=new Set(list.map(c=>c.id));
  Object.keys(d.ex||{}).forEach(id=>{ if(id.startsWith('x-') && !ids.has(id)){ const e=d.ex[id]; if(e&&(e.done||(e.sets||[]).some(s=>s.w!==''||s.r!==''))){ list.push({id, name:exName(id)}); ids.add(id);} } });
  return list.map(c=>({id:c.id, name:c.name, tag:'+', custom:true, day:lift}));
}
function exName(id){
  if(id.startsWith('x-')){
    for(const L of Object.keys(S.custom)) for(const c of S.custom[L]) if(c.id===id) return c.name;
    for(const k of Object.keys(S.days)){ const e=S.days[k].ex&&S.days[k].ex[id]; if(e&&e.name) return e.name; }
    return id.slice(2).replace(/-/g,' ');
  }
  if(!exName.M){ exName.M={}; ['A','B','C','D'].forEach(dy=>[1,5].forEach(w=>['','board'].forEach(v=>workout(dy,w,v).forEach(e=>exName.M[e.id]=e.name)))); }
  return exName.M[id]||id;
}
function knownCustomNames(){
  const s=new Set(); Object.values(S.custom).forEach(l=>l.forEach(c=>s.add(c.name)));
  Object.values(S.days).forEach(d=>Object.entries(d.ex||{}).forEach(([id,e])=>{ if(id.startsWith('x-')) s.add(e.name||exName(id)); }));
  return [...s].sort();
}

function streakOf(id){ let s=0,c=todayN(); if(!doneOn(id,peek(keyOf(c)))) c--; while(doneOn(id,peek(keyOf(c)))){ s++; c--; } return s; }
function feelTrend(n){
  const pts=[]; for(let i=0;i<14;i++){ const x=peek(keyOf(n-13+i)); if(x&&x.feel!==undefined&&x.feel!==''&&!isNaN(+x.feel)) pts.push([i,+x.feel]); }
  if(!pts.length) return '';
  const W=500,H=130,X=i=>14+i*(W-28)/13, Y=v=>H-14-(v/10)*(H-28);
  const avg=(pts.reduce((a,p)=>a+p[1],0)/pts.length).toFixed(1);
  const col=v=>v<=2?'#3ecf8e':v<=5?'#f5c451':'#ff6b6b';
  return `<div class="muted" style="margin:14px 2px 4px"><b style="color:var(--text)">Shoulder feel</b> · last 14 days · avg ${avg} <span style="float:right">0 = no pain</span></div>
   <svg class="trend" viewBox="0 0 ${W} ${H}"><line x1="14" x2="${W-14}" y1="${Y(0)}" y2="${Y(0)}" stroke="#2a303b"/><line x1="14" x2="${W-14}" y1="${Y(5)}" y2="${Y(5)}" stroke="#2a303b" stroke-dasharray="4 5"/><line x1="14" x2="${W-14}" y1="${Y(10)}" y2="${Y(10)}" stroke="#2a303b"/>
   ${pts.length>1?`<polyline fill="none" stroke="#9aa3b2" stroke-width="2.5" points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`:''}
   ${pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="6" fill="${col(p[1])}"/>`).join('')}</svg>
   <div class="muted" style="display:flex;justify-content:space-between;font-size:12px"><span>${fmt(n-13)}</span><span>${fmt(n)}</span></div>`;
}
function weekSummary(n){
  const wd=wdOf(n), mon = n - ((wd+6)%7);
  const rows=HABITS.filter(x=>hon(x.id)&&x.id!=='trained'||x.id==='trained').filter(x=>x.id==='trained'||hon(x.id)).sort((a,b)=>{const o=['trained','bjj','pt','bw','creatine','protein','water','steps','food','prayer','read','mood','journal','spanish','visual','cold']; return o.indexOf(a.id)-o.indexOf(b.id);});
  let total=0, hit=0;
  let g = `<div class="wk"><div></div>${['M','T','W','T','F','S','S'].map((x,i)=>`<div class="h ${mon+i===n?'cur':''}">${x}</div>`).join('')}`;
  rows.forEach(x=>{
    g += `<div class="rl">${esc(x.id==='trained'?x.short:hshort(x.id))}</div>`;
    for(let i=0;i<7;i++){
      const dn=mon+i, dd=peek(keyOf(dn));
      if(!applicable(x.id,dn)){ g+=`<div class="dot na"></div>`; continue; }
      const on=doneOn(x.id,dd), half=x.kind==='pt'&&dd&&!on&&(ptMob(dd)||ptStr(dd));
      if(dn<=todayN() && x.kind!=='weekly'){ total++; if(on) hit++; }
      g += `<div class="dot ${on?'on':half?'half':''}"></div>`;
    }
  });
  g += `</div>`;
  const wk=HABITS.filter(x=>x.kind==='weekly'&&hon(x.id)).map(x=>{ const c=weekCount(x.id,n), t=ht(x.id); return `<span class="chip ${c>=t?'on':''}">${esc(hname(x.id))} ${c}/${t}</span>`; }).join('');
  const st=['creatine','protein','water','steps','food','prayer','read'].filter(id=>hon(id)).map(id=>[id,streakOf(id)]).filter(z=>z[1]>0)
    .map(z=>`<span class="chip">🔥 ${esc(hshort(z[0]))} ${z[1]}</span>`).join('');
  let streak=streakOf('creatine');
  let lifts=0, planned=0; for(let i=0;i<7;i++){ const dn=mon+i; if(liftFor(dn) && !isSkipped(dn) && weekOf(dn)>=1 && weekOf(dn)<=NWEEKS){ planned++; const x=peek(keyOf(dn)); if(x&&x.checks.trained) lifts++; } }
  return `<div class="sec">This week · ${fmt(mon)}–${fmt(mon+6)}</div><div class="card">
    <div class="stats"><div class="stat"><b>${streak}🔥</b><small>creatine streak</small></div>
    <div class="stat"><b>${lifts}/${planned}</b><small>lifts done</small></div>
    <div class="stat"><b>${total?Math.round(100*hit/total):0}%</b><small>checks so far</small></div></div>${g}
    ${wk?`<div class="muted" style="margin:14px 2px 6px">Weekly targets</div><div class="chips">${wk}</div>`:''}
    ${st?`<div class="muted" style="margin:14px 2px 6px">Streaks (days in a row)</div><div class="chips">${st}</div>`:''}
    ${hon('pt')?feelTrend(n):''}</div>`;
}

      if(!sets.some(s=>s.w!=='')) return;

  }
  h += rows.length? rows.reverse().join('') : `<p class="muted">Nothing logged yet. Entries appear here after you log sets on the Today screen.</p>`;

}

document.querySelector('nav.tabs').addEventListener('click', e=>{

app.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, k=keyOf(view.n);
  switch(act){
    case 'prev': view.n--; view.open={}; view.addEx=false; view.moveOpen=false; render(); break;
    case 'next': view.n++; view.open={}; view.addEx=false; view.moveOpen=false; render(); break;
    case 'today': view.n=todayN(); view.open={}; render(); break;
    case 'goto': view.n=+b.dataset.n; view.open={}; render(); break;
    case 'toggle': { const d=peek(k), id=b.dataset.id; const cur = view.open[id] ?? !((d&&d.ex[id])||{}).done;
      view.open[id]=!cur; render(); break; }
    case 'done': { const d=D(k), id=b.dataset.id; const e=d.ex[id]||(d.ex[id]={sets:[],done:false}); e.done=!e.done;
      if(e.done){ view.open[id]=false; d.checks.trained=true; } save(); render(); break; }
    case 'addset': { const d=D(k), id=b.dataset.id; const e=d.ex[id]||(d.ex[id]={sets:[],done:false}); if(b.dataset.name) e.name=b.dataset.name;
      const visible=app.querySelectorAll(`input[data-id="${id}"][data-f="r"]`).length;
      while(e.sets.length<visible) e.sets.push({w:'',r:'',rpe:''});
      e.sets.push({w:'',r:'',rpe:''}); view.open[id]=true; save(); render();
      const ins=app.querySelectorAll(`input[data-id="${id}"][data-i="${e.sets.length-1}"]`); if(ins[0]) ins[0].focus({preventScroll:true});
      break; }
    case 'delset': { const d=D(k), id=b.dataset.id; if(d.ex[id]) d.ex[id].sets.splice(+b.dataset.i,1); save(); render(); break; }
    case 'check': { const d=D(k), id=b.dataset.id;
      if(id==='pt_mob'||id==='pt_str'){ const m=ptMob(d), s=ptStr(d); d.checks.pt_mob=m; d.checks.pt_str=s; d.checks[id]=!(id==='pt_mob'?m:s); }
      else d.checks[id]=!d.checks[id];
      save(); render(); break; }
    case 'prot': { const d=D(k); d.protein=Math.max(0,(d.protein||0)+(+b.dataset.v)); save(); render(); break; }
    case 'variant': { const d=D(k); d.variant=b.dataset.v; save(); render(); break; }
    case 'hist': view.histLift=b.dataset.id; render(); break;
    case 'sec': { const id=b.dataset.id; S.ui.sec[id]=S.ui.sec[id]===false; saveNow(); render(); break; }
    case 'water': { const d=D(k); d.water=Math.max(0,num0(d.water)+(+b.dataset.v)); save(); render(); break; }
    case 'feel': { const d=D(k), v=+b.dataset.v; d.feel=(d.feel!==undefined&&d.feel!==''&&+d.feel===v)?'':v; save(); render(); break; }
    case 'mood': { const d=D(k), v=+b.dataset.v; d.mood=(num0(d.mood)===v)?'':v; save(); render(); break; }
    case 'routine': view.routine=!view.routine; { const y=scrollY; render(); scrollTo(0,y); } break;
    case 'habOn': { const id=b.dataset.id; S.habits[id]=S.habits[id]||{}; S.habits[id].on=!hon(id); commit(); { const y=scrollY; render(); scrollTo(0,y); } break; }
    case 'habReset': if(confirm('Reset all habit names, goals and on/off to the defaults? Your logged data is kept.')){ S.habits={}; commit(); render(); } break;
    case 'moveOpen': view.moveOpen=true; render(); break;
    case 'moveCancel': view.moveOpen=false; render(); break;
    case 'moveTo': { const k2=b.dataset.k, L1=liftFor(view.n), L2=liftFor(fromKey(k2));
      const warn=[]; if(hasLogs(k, L1)) warn.push(`You already logged some Day ${L1} sets on ${shortDay(k)}; they stay on that date.`);
      if(L2 && hasLogs(k2, L2)) warn.push(`Day ${L2} already has logs on ${shortDay(k2)}.`);
      const q = L2 ? `Swap Day ${L1} (${shortDay(k)}) with Day ${L2} (${shortDay(k2)})?` : `Move Day ${L1} to ${shortDay(k2)}?`;
      if(!confirm([q,...warn].join('\n\n'))) break;
      moveWorkout(k, k2); view.moveOpen=false; commit(); view.n=fromKey(k2); view.open={}; render(); window.scrollTo(0,0); break; }
    case 'skipDay': if(confirm(`Skip Day ${liftFor(view.n)} on ${shortDay(k)}?`)){ S.skip[k]=true; view.moveOpen=false; commit(); render(); } break;
    case 'unskip': delete S.skip[k]; commit(); render(); break;
    case 'resetWeek': if(confirm('Put this week back to the normal schedule (Mon B, Tue A, Thu C, Sat D)? Logged sets are kept.')){ resetWeek(view.n); view.moveOpen=false; commit(); render(); } break;
    case 'addExOpen': view.addEx=true; render(); setTimeout(()=>{ const i=document.getElementById('newEx'); if(i) i.focus(); },50); break;
    case 'addExCancel': view.addEx=false; render(); break;
    case 'addExSave': { const name=(document.getElementById('newEx').value||'').trim().replace(/\s+/g,' ').slice(0,60); if(!name) break;
      const lift=liftFor(view.n); if(!lift) break; const id=slug(name); if(id==='x-') break;
      const list=S.custom[lift]=S.custom[lift]||[]; const ex=list.find(c=>c.id===id);
      if(!ex) list.push({id, name, added:k}); else if(ex.added>k) ex.added=k;
      view.addEx=false; view.open[id]=true; commit(); render(); break; }
    case 'rmEx': { const id=b.dataset.id, lift=liftFor(view.n);
      if(!confirm(`Stop showing "${b.dataset.name}" on Day ${lift}? Past logs stay in History.`)) break;
      S.custom[lift]=(S.custom[lift]||[]).filter(c=>c.id!==id);
      const d=peek(k); if(d&&d.ex[id]&&!(d.ex[id].sets||[]).some(s=>s.w!==''||s.r!=='')) delete d.ex[id];
      commit(); render(); break; }
    case 'resetTargets': if(confirm('Reset all main-lift targets to the plan defaults?')){ S.targets={}; commit(); render(); } break;
    case 'export': doExport(); break;
    case 'syncNow': Sync.run(true); break;
    case 'syncTest': Sync.test(); break;
    case 'syncPaste': Sync.pasteFromClipboard(); break;
    case 'syncSave': { const v=document.getElementById('syncInput').value; Sync.setFromText(v, true); break; }
    case 'syncOff': if(confirm('Disconnect coach sync on this phone? Your logs stay on the phone.')){ Sync.setUrl(''); render(); } break;
    case 'import': document.getElementById('importFile').click(); break;
  }
});

  else if(el.id==='steps'){ const d=D(k); d.steps=el.value; save(); el.closest('.ckrow').querySelector('.chk').classList.toggle('on', num0(el.value)>=hg('steps')); }
  else if(el.id==='bw'){ const d=D(k); d.bw=el.value; save(); document.getElementById('bwnote').innerHTML=bwNote(view.n, parseFloat(el.value)); el.closest('.ckrow').querySelector('.chk').classList.toggle('on', el.value!==''); }
  else if(el.dataset.tw){ const w=el.dataset.tw, s=el.dataset.ts; S.targets[w]=S.targets[w]||{}; S.targets[w][s]=Object.assign(target(+w,s),{[el.dataset.tf]:el.value}); save(); }
});
app.addEventListener('change', e=>{ if(e.target.id==='histPick'){ if(e.target.value){ view.histLift=e.target.value; render(); } return; } if(e.target.id==='bw' || e.target.id==='steps' || e.target.dataset.tw || e.target.dataset.hn) { saveNow(); if(view.tab==='today') refreshLive(); } });

// Update counts / weekly summary in place (a full re-render here would swallow the tap that blurred the input).
function refreshLive(){
  const n=view.n, d=peek(keyOf(n)); if(!d) return;
  SECS.forEach(([sid])=>{ const el=document.querySelector(`.cshead[data-id="${sid}"] .cnt`); if(!el) return;
    let done=0,tot=0; HABITS.filter(x=>x.sec===sid&&hon(x.id)&&applicable(x.id,n)).forEach(x=>{ const c=itemCount(x,d,n); done+=c[0]; tot+=c[1]; });
    el.textContent=`${done}/${tot}`; el.classList.toggle('full', tot>0&&done===tot); });
  const box=document.getElementById('wkbox'); if(box) box.innerHTML=weekSummary(n);
}

async function doExport(){
  saveNow();
  const name=`q4lift-backup-${keyOf(todayN())}.json`;
  const blob=new Blob([JSON.stringify({app:'q4lift',version:1,exported:new Date().toISOString(),data:S},null,1)],{type:'application/json'});
  const msg=document.getElementById('bkmsg');
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Q4 Lift backup'}); msg.textContent='Backup shared.'; return; }
  }catch(err){ if(err && err.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  msg.textContent='Backup downloaded: '+name;
}
document.getElementById('importFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  try{ const j=JSON.parse(await f.text()); const data=j.data||j; if(!data.days) throw new Error('Not a Q4 Lift backup');
    if(!confirm(`Replace all data on this phone with the backup (${Object.keys(data.days).length} days)?`)) return;
    S=data; normalize(); commit(); render(); document.getElementById('bkmsg').textContent='Backup restored ✓';
  }catch(err){ alert('Import failed: '+err.message); }
});

// Refresh "today" if the app is left open past midnight

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && todayN()!==lastToday){ if(view.n===lastToday) view.n=todayN(); lastToday=todayN(); render(); } });
/* ================= COACH SYNC =================
   Phone → Google Apps Script web app → private Google Sheet.
   The sync URL (which carries the secret token) lives only in this phone's localStorage
   under its own key, never in backups and never in the public code. */
const SYNC_KEY='q4lift.sync';
const Sync = (()=>{
  let cfg; try{ cfg=JSON.parse(localStorage.getItem(SYNC_KEY))||{}; }catch(e){ cfg={}; }
  cfg.rev=cfg.rev||0; cfg.syncedRev=cfg.syncedRev||0; cfg.fails=cfg.fails||0;
  let timer=null, inflight=false;
  const persist=()=>{ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); }catch(e){} };
  const valid=u=>{ try{ const x=new URL(u); return (x.protocol==='https:' && /(^|\.)(script\.google\.com|script\.googleusercontent\.com)$/.test(x.hostname))
      || (x.protocol==='http:' && /^(localhost|127\.0\.0\.1)$/.test(x.hostname)); }catch(e){ return false; } };
  function extract(text){
    if(!text) return null; text=String(text).trim();
    const m=text.match(/#sync=([^\s]+)/); if(m){ try{ const u=decodeURIComponent(m[1]); if(valid(u)) return u; }catch(e){} }
    const m2=text.match(/https?:\/\/[^\s"'<>]+/g)||[]; for(const u of m2){ if(valid(u)) return u; }
    return null;
  }
  function setUrl(u){ cfg.url=u||''; cfg.fails=0; cfg.lastErr=null; if(u){ cfg.rev=(cfg.rev||0)+1; } persist(); paint(); if(u) schedule(500); }
  function setFromText(text, fromUI){
    const u=extract(text); const msg=document.getElementById('syncmsg');
    if(!u){ if(msg) msg.textContent="That doesn't look like a sync link. It should start with https://script.google.com/ or be the setup link."; return false; }
    setUrl(u); if(fromUI){ view.syncEdit=false; render(); const m=document.getElementById('syncmsg'); if(m) m.textContent='Sync link saved ✓ Syncing…'; } return true;
  }
  async function pasteFromClipboard(){
    const msg=document.getElementById('syncmsg');
    try{ const t=await navigator.clipboard.readText(); if(!setFromText(t,true) && msg) msg.textContent='Clipboard has no sync link. Copy the link your coach sent, then try again (or paste it in the box).'; }
    catch(e){ view.syncEdit=true; render(); const m=document.getElementById('syncmsg'); if(m) m.textContent='Could not read the clipboard. Long-press the box above and Paste, then tap Save link.'; }
  }
  function touch(){ cfg.rev=(cfg.rev||0)+1; persist(); if(cfg.url) schedule(4000); }
  function schedule(ms){ clearTimeout(timer); timer=setTimeout(()=>run(false), ms); }
  const yes=v=>!!v;
  const num=v=>(v===''||v==null)?'':(isNaN(+v)?String(v):+v);
  let NAMES=null;
  function nameOf(id){
    if(!NAMES){ NAMES={}; ['A','B','C','D'].forEach(dy=>[1,5].forEach(w=>['','board'].forEach(v=>workout(dy,w,v).forEach(e=>NAMES[e.id]=e.name)))); }
    return exName(id);
  }
  function payload(){
    const dates=Object.keys(S.days).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    const daily=[], sets=[];
    dates.forEach(k=>{
      const d=S.days[k]||{}, n=fromKey(k), wd=wdOf(n), w=weekOf(n), inProg=w>=1&&w<=NWEEKS;
      const sk=inProg&&isSkipped(n), so=S.sched[k]||{}, lift=inProg&&!sk?liftFor(n):null, c=d.checks||{}, ex=d.ex||{};
      const exs=lift?workout(lift,w,d.variant||''):[];
      const doneN=Object.keys(ex).filter(id=>ex[id]&&ex[id].done).length;
      daily.push([k, inProg?w:'', DOW[wd], lift?DAY_TITLE[lift]+(so.from?` (${so.swap?'swapped with':'moved from'} ${so.from})`:''):sk?`Day ${liftFor(n)} skipped`:so.to?`No lifting (Day moved to ${so.to})`:(wd===0?'Rest (Sunday)':'No lifting'),
        yes(c.creatine), yes(c.trained), BJJ_DAYS.has(wd)?yes(c.bjj):'', d.protein||0, yes(ptMob(d)||ptStr(d)), num(d.bw),
        lift?`${doneN} of ${exs.length}`:(doneN?`${doneN}`:''), d.notes||'',
        num(d.water), num(d.steps), yes(c.prayer), yes(c.food), yes(c.read), num(d.mood), yes(ptMob(d)), yes(ptStr(d)), num(d.feel),
        yes(c.journal), yes(c.spanish), yes(c.cold), yes(c.visual)]);
      Object.keys(ex).forEach(id=>{
        const e=ex[id]||{}, main=/^(A1|B1|C1-board|C1-bench|D1)$/.test(id);
        const ss=(e.sets||[]).filter(s=>s&&(s.w!==''||s.r!==''||s.rpe!==''));
        if(!ss.length && e.done) sets.push([k, inProg?w:'', lift||'', id, nameOf(id), '', '', '', '', true, main]);
        ss.forEach((s,i)=>sets.push([k, inProg?w:'', lift||'', id, nameOf(id), i+1, num(s.w), num(s.r), main?num(s.rpe):'', yes(e.done), main]));
      });
    });
    return {app:'q4lift', v:APP_VERSION, rev:cfg.rev, sentAt:new Date().toISOString(), dates, daily, sets, raw:S};
  }
  async function post(body, keepalive){
    const ctl=('AbortController' in window)?new AbortController():null; const to=setTimeout(()=>ctl&&ctl.abort(), 25000);
    try{
      const res=await fetch(cfg.url,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, redirect:'follow', keepalive:!!keepalive, signal:ctl?ctl.signal:undefined});
      const txt=await res.text(); let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error(res.ok?'Unexpected reply from Google (check the deployment is "Anyone")':'HTTP '+res.status); }
      if(!j.ok) throw new Error(j.error==='unauthorized'?'Wrong or missing token in sync link':(j.error||'Sync failed'));
      return j;
    } finally { clearTimeout(to); }
  }
  async function run(force, keepalive){
    if(!cfg.url || inflight) return;
    if(!force && cfg.syncedRev>=cfg.rev) { paint(); return; }
    if(!navigator.onLine && !force){ cfg.lastErr='Offline — will sync when back online'; persist(); paint(); return; }
    inflight=true; const sendRev=cfg.rev; paint('Syncing…');
    try{
      const p=payload(); const body=JSON.stringify(p);
      await post(body, keepalive && body.length<60000);
      cfg.syncedRev=Math.max(cfg.syncedRev, sendRev); cfg.lastOk=new Date().toISOString(); cfg.lastErr=null; cfg.fails=0;
    }catch(e){
      cfg.fails=(cfg.fails||0)+1; cfg.lastErr=(e&&e.name==='AbortError')?'Timed out':(e&&e.message)||'Network error'; cfg.lastErrAt=new Date().toISOString();
    }finally{
      inflight=false; persist(); paint();
      if(cfg.url && cfg.syncedRev<cfg.rev) schedule(cfg.lastErr? Math.min(30000*Math.pow(2,Math.max(0,cfg.fails-1)), 600000) : 2000);
    }
  }
  async function test(){
    const msg=document.getElementById('syncmsg'); if(msg) msg.textContent='Testing…';
    try{ const res=await fetch(cfg.url,{method:'GET', redirect:'follow'}); const j=JSON.parse(await res.text());
      if(msg) msg.textContent=j.ok?'Connection OK ✓':'Server said: '+(j.error||'error'); }
    catch(e){ if(msg) msg.textContent='Test failed: '+(e.message||e); }
  }
  const tfmt=iso=>{ const d=new Date(iso); const t=d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    return (new Date().toDateString()===d.toDateString())? t : d.toLocaleDateString([], {month:'short', day:'numeric'})+' '+t; };
  function statusText(override){
    if(!cfg.url) return {cls:'', txt:'Coach sync is off'};
    if(override) return {cls:'', txt:'☁️ '+override};
    const pending=cfg.syncedRev<cfg.rev;
    if(cfg.lastErr && pending) return {cls:'err', txt:`⚠️ Not synced yet: ${cfg.lastErr}. Will retry.${cfg.lastOk?' Last synced '+tfmt(cfg.lastOk)+'.':''}`};
    if(pending) return {cls:'', txt:'☁️ Changes waiting to sync…'};
    if(cfg.lastOk) return {cls:'ok', txt:'☁️ Synced '+tfmt(cfg.lastOk)};
    return {cls:'', txt:'☁️ Not synced yet'};
  }
  function paint(override){ const s=statusText(override); document.querySelectorAll('[data-sync-status]').forEach(el=>{ el.textContent=s.txt; el.classList.toggle('ok',s.cls==='ok'); el.classList.toggle('err',s.cls==='err'); el.classList.toggle('hidden', !cfg.url && el.classList.contains('syncline')); }); }
  function maskedUrl(){ try{ const x=new URL(cfg.url); return x.origin+x.pathname.replace(/\/s\/([^/]{6})[^/]+(\/)/,'/s/$1…$2')+(x.search?' (token saved)':''); }catch(e){ return ''; } }
  return {cfg, touch, run, test, setUrl, setFromText, pasteFromClipboard, paint, payload, maskedUrl, extract};
})();

function showTopBanner(html, btnLabel, onClick, ms){
  const old=document.querySelector('.topbanner'); if(old) old.remove();
  const el=document.createElement('div'); el.className='topbanner'; el.innerHTML=`<span>${html}</span>`;
  if(btnLabel){ const b=document.createElement('button'); b.className='btn pri'; b.textContent=btnLabel; b.onclick=onClick; el.appendChild(b); }
  const x=document.createElement('button'); x.className='btn'; x.textContent='✕'; x.onclick=()=>el.remove(); el.appendChild(x);
  document.body.appendChild(el); if(ms) setTimeout(()=>el.remove(), ms);
}

// One-time setup link: …/lift/#sync=<encoded Apps Script URL with ?token=…>
(function handleSetupLink(){
  if(!/^#sync=/.test(location.hash)) return;
  const full=location.href, u=Sync.extract(location.hash);
  history.replaceState(null,'',location.pathname+location.search);   // remove the secret from the address bar
  if(!u){ showTopBanner('That sync link looks broken. Ask your coach for a new one.'); return; }
  Sync.setUrl(u);
  const standalone = navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(standalone){ showTopBanner('✅ Coach sync connected.', null, null, 6000); }
  else {
    showTopBanner('Sync saved in this browser. <b>Using Q4 Lift from your home screen?</b> Tap Copy, open the home-screen app → Plan &amp; Backup → Paste sync link.',
      'Copy', async ()=>{ try{ await navigator.clipboard.writeText(full); document.querySelector('.topbanner span').innerHTML='Copied ✓ Now open Q4 Lift from your home screen → Plan &amp; Backup → Paste sync link.'; }catch(e){ prompt('Copy this link:', full); } });
  }
})();

render();
Sync.paint();
setTimeout(()=>Sync.run(false), 1500);                       // catch up on open
window.addEventListener('online', ()=>Sync.run(false));
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ saveNow(); Sync.run(false, true); } else { Sync.paint(); Sync.run(false); } });

if('serviceWorker' in navigator && location.protocol!=='file:'){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let shown=false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!hadController || shown) return; shown=true;
    // Only nag if the page on screen is older than what the server has.
    fetch('./index.html',{cache:'no-store'}).then(r=>r.text()).then(t=>{ if(!t.includes(APP_VERSION))
      showTopBanner('A new version of Q4 Lift is ready.', 'Reload', ()=>{ saveNow(); location.reload(); }); }).catch(()=>{});
  });
}
